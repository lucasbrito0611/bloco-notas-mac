# Roda os testes em todo push na main e em pull requests.
# O workflow de release também chama este aqui antes de gerar o instalador.
name: Testes

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm test

      # Garante que a interface compila, não só que os testes passam.
      - run: npm run build
