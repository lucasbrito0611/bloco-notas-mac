# Gera o instalador e publica no GitHub Releases sempre que uma tag de versão (v1.2.3) é enviada.
# Para lançar uma versão: npm version patch && git push --follow-tags
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Gerar instalador
        run: npx electron-builder --win --publish never

      # O latest.yml é o arquivo que o electron-updater lê nos apps instalados para achar a versão nova.
      # Cria a release só se ainda não existir e repete o envio, porque a API do GitHub às vezes devolve 500.
      - name: Publicar no GitHub Releases
        shell: bash
        run: |
          retry() { for i in 1 2 3 4 5; do "$@" && return 0; echo "Falhou, tentando de novo ($i)..."; sleep $((i * 10)); done; return 1; }
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 ||
            retry gh release create "$GITHUB_REF_NAME" --title "Notas $GITHUB_REF_NAME" \
              --notes-file .github/release-notes.md --generate-notes --verify-tag
          # Nome fixo (sem versão) para o link releases/latest/download/Notas-Setup.exe sempre funcionar.
          retry gh release upload "$GITHUB_REF_NAME" --clobber \
            release/Notas-Setup.exe \
            release/Notas-Setup.exe.blockmap \
            release/latest.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
